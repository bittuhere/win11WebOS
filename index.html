    <script>
      /*
        ── Storage safety net ────────────────────────────────────────────────
        This page is often embedded (previews, docs, school sites) inside a
        sandboxed iframe, and some browsers/private modes hand out a window
        where touching localStorage, sessionStorage, document.cookie or
        navigator.serviceWorker THROWS. The OS reads all four, so without this
        guard a sandboxed embed died before painting a single pixel.

        The probe below runs before any app code. If real storage is available
        nothing changes at all; if it is not, we install in-memory stand-ins so
        the desktop still boots (just without persistence for that session).
      */
      (function () {
        "use strict";
        var memory = {};
        function makeStore() {
          var m = new Map();
          var api = {
            getItem: function (k) {
              return m.has(String(k)) ? m.get(String(k)) : null;
            },
            setItem: function (k, v) {
              m.set(String(k), String(v));
            },
            removeItem: function (k) {
              m.delete(String(k));
            },
            clear: function () {
              m.clear();
            },
            key: function (i) {
              var k = Array.from(m.keys());
              return i >= 0 && i < k.length ? k[i] : null;
            },
          };
          /* `length` must be a live getter, exactly like the real thing */
          Object.defineProperty(api, "length", {
            get: function () {
              return m.size;
            },
          });
          return api;
        }
        function install(name) {
          try {
            var probe = window[name];
            probe.setItem("__wos_probe__", "1");
            probe.removeItem("__wos_probe__");
            return false; /* the real thing works — leave it alone */
          } catch (e) {
            try {
              Object.defineProperty(window, name, { value: makeStore(), configurable: true });
            } catch (e2) {
              try {
                window[name] = makeStore();
              } catch (e3) {}
            }
            memory[name] = true;
            return true;
          }
        }
        var degraded = install("localStorage");
        degraded = install("sessionStorage") || degraded;
        try {
          void document.cookie;
        } catch (e) {
          degraded = true;
          try {
            Object.defineProperty(document, "cookie", {
              get: function () {
                return "";
              },
              set: function () {},
              configurable: true,
            });
          } catch (e2) {}
        }
        try {
          void navigator.serviceWorker;
        } catch (e) {
          degraded = true;
          try {
            Object.defineProperty(navigator, "serviceWorker", {
              value: {
                register: function () {
                  return Promise.resolve(null);
                },
                getRegistrations: function () {
                  return Promise.resolve([]);
                },
                ready: new Promise(function () {}),
              },
              configurable: true,
            });
          } catch (e2) {}
        }
        /* tell the shell it is running without persistence (settings ▸ storage) */
        window.__wosStorageDegraded = degraded;
      })();
    </script>
