# Keep the toolchain and actions current without surprise bumps:
# patch/minor updates land weekly, majors stay manual.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react*", "@types/react*"]
      toolchain:
        patterns: ["vite", "@vitejs/*", "tailwindcss", "postcss", "autoprefixer", "sass"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
