name: Feature request
description: Suggest an app, a behaviour or a fix worth making
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it belong in the OS?
      description: Windows 11 fidelity, a missing app, a rough edge in an existing one…
    validations:
      required: true
  - type: textarea
    id: sketch
    attributes:
      label: How could it work?
      description: Optional — a sketch, a reference screenshot, or the API you would use.
    validations:
      required: false
