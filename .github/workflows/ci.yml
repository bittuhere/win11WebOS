name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Offline driver (jsdom, no browser, no network)
        run: npm run test:driver

      - name: Upload validated Pages output
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-v1.02
          path: build/
          include-hidden-files: true
          retention-days: 7

  suites:
    name: Browser suites
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - name: Playwright + Chromium
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: v1.02 production CSP/offline acceptance and staged upgrade
        run: |
          PORT=4182 node scripts/serve-production.cjs &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          WOS_TEST_URL=http://127.0.0.1:4182/ python tests/release_browser.py
          WOS_TEST_URL=http://127.0.0.1:4182/ python tests/production_ready.py
          WOS_TEST_URL=http://127.0.0.1:4182/ python tests/shell_update_followup.py
          WOS_TEST_URL=http://127.0.0.1:4182/ python tests/search_layout_feed.py
          python tests/update_roundtrip.py
      - name: Serve the production build on :4180
        run: |
          python -m http.server 4180 --directory build &
          sleep 2
      - name: Core shell regressions (About, links, Solitaire, windows)
        run: python tests/verify.py
      - name: Handed-over Github links and the integrated browser
        run: python tests/iframe_flow_test.py
      - name: File types, associations, icons and the Notepad open/close path
        run: python tests/file_types.py
      - name: Phone layout and the landscape gate, device by device
        run: python tests/rotate_gate_devices.py
      - name: The fitted phone interface and the gate switch in Settings
        run: python tests/mobile_layout.py
      - name: Solitaire end to end
        run: python tests/solitaire_aash.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-screenshots
          path: |
            tests/*.png
            artifacts/*.png
            artifacts/*.log
          if-no-files-found: ignore
