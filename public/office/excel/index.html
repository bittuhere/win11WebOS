<html lang="en">
<head>
<meta charset="utf-8">
<title>Book1 - Excel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="excel.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='1' y='1' width='30' height='30' rx='5' fill='%23217346'/><path d='M10 9h3l3 7 3-7h3l-4.5 9.5L22 23h-3l-3-6.5L13 23h-3l4.5-9z' fill='white'/></svg>">
</head>
<body>
<div id="app" class="app">

  <!-- ==================== TITLE BAR ==================== -->
  <div id="titlebar">
    <div id="tb-left">
      <button id="tb-logo" title="Excel">
        <svg viewBox="0 0 32 32" width="17" height="17"><rect x="1" y="1" width="30" height="30" rx="5" fill="#fff"/><path d="M10 9h3l3 7 3-7h3l-4.5 9.5L22 23h-3l-3-6.5L13 23h-3l4.5-9z" fill="#217346"/></svg>
      </button>
      <div id="qat">
        <button id="qat-save" class="tb-btn" title="Save (Ctrl+S)"></button>
        <button id="qat-undo" class="tb-btn" title="Undo (Ctrl+Z)"></button>
        <button id="qat-redo" class="tb-btn" title="Redo (Ctrl+Y)"></button>
        <button id="qat-more" class="tb-btn" title="Customize Quick Access Toolbar"></button>
      </div>
      <div id="autosave" title="AutoSave is off">
        <span id="as-label">AutoSave</span>
        <span id="as-pill" class="as-pill"><span class="as-knob"></span></span>
        <span id="as-state">Off</span>
      </div>
    </div>
    <div id="tb-title" title="Rename">
      <span id="tb-name">Book1</span>
      <span id="tb-suffix"> - Excel</span>
      <svg class="tb-chev" viewBox="0 0 10 6" width="9" height="6"><path d="M1 1l4 4 4-4" stroke="currentColor" fill="none" stroke-width="1.2"/></svg>
    </div>
    <div id="tb-right">
      <div id="ribbon-user"><span id="user-name">User</span>
        <span id="user-avatar"><svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="8" r="4.2" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M4.5 19.5c1.4-3.6 4.2-5 7.5-5s6.1 1.4 7.5 5" fill="none" stroke="#fff" stroke-width="1.4"/></svg></span>
      </div>
      <button class="win-btn" id="win-min" title="Minimize"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1"/></svg></button>
      <button class="win-btn" id="win-max" title="Maximize"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
      <button class="win-btn win-close" id="win-close" title="Close"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1"/></svg></button>
    </div>
  </div>

  <!-- ==================== TAB ROW ==================== -->
  <div id="tabrow">
    <div id="tabs"></div>
    <div id="tellme">
      <svg viewBox="0 0 16 16" width="13" height="13"><circle cx="7" cy="7" r="4.6" fill="none" stroke="#666" stroke-width="1.3"/><path d="M10.5 10.5L14 14" stroke="#666" stroke-width="1.6"/></svg>
      <input id="tellme-input" placeholder="Tell me what you want to do" spellcheck="false">
    </div>
  </div>

  <!-- ==================== RIBBON ==================== -->
  <div id="ribbon"></div>

  <!-- ==================== FORMULA BAR ==================== -->
  <div id="fxbar">
    <div id="namebox" title="Name Box">
      <span id="namebox-text">A1</span>
      <svg class="nb-chev" viewBox="0 0 10 6" width="8" height="5"><path d="M1 1l4 4 4-4" stroke="#444" fill="none" stroke-width="1.2"/></svg>
    </div>
    <div id="fx-opts">
      <button id="fx-btn" title="Insert Function"><i>fx</i></button>
      <button id="fx-cancel" title="Cancel (Esc)" hidden><svg viewBox="0 0 12 12" width="11" height="11"><path d="M2 2l8 8M10 2l-8 8" stroke="#a33" stroke-width="1.4"/></svg></button>
      <button id="fx-enter" title="Enter (Return)" hidden><svg viewBox="0 0 12 12" width="11" height="11"><path d="M2 6.5l3 3 5.5-6.5" fill="none" stroke="#2b7" stroke-width="1.4"/></svg></button>
    </div>
    <div id="fx-input-wrap">
      <div id="fx-mirror" class="fx-mirror"></div>
      <textarea id="fx-input" class="fx-edit" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Formula Bar"></textarea>
    </div>
    <button id="fx-expand" title="Expand Formula Bar"><svg viewBox="0 0 10 6" width="9" height="6"><path d="M1 1l4 4 4-4" stroke="#666" fill="none" stroke-width="1.2"/></svg></button>
  </div>

  <!-- ==================== FIND BAR ==================== -->
  <div id="findbar">
    <svg viewBox="0 0 16 16" width="13" height="13" style="color:#666"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6"/></svg>
    <input id="fb-find" placeholder="Find what (Ctrl+F)" spellcheck="false">
    <span class="fb-count" id="fb-count"></span>
    <button id="fb-prev">Previous</button>
    <button id="fb-next">Next</button>
    <span id="fb-repl-row" style="display:none;align-items:center;gap:8px">
      <input id="fb-repl" placeholder="Replace with">
      <button id="fb-repl-one">Replace</button>
      <button id="fb-repl-all">Replace All</button>
    </span>
    <span style="flex:1"></span>
    <button id="fb-x" title="Close" style="border:none;width:22px;padding:0"><svg viewBox="0 0 12 12" width="11" height="11"><path d="M2 2l8 8M10 2l-8 8" stroke="#666" stroke-width="1.2"/></svg></button>
  </div>

  <!-- ==================== GRID ==================== -->
  <div id="grid-scroll">
    <div id="grid-stage">
      <table id="colhdr" class="hdr"></table>
      <table id="rowhdr" class="hdr"></table>
      <div id="corner" title="Select All"></div>
      <div id="cells-layer" class="layer"></div>
      <div id="frozencols-layer" class="layer flayer"></div>
      <div id="frozenrows-layer" class="layer flayer"></div>
      <div id="frozencorner-layer" class="layer flayer"></div>
      <div id="objects-layer"></div>
      <div id="sel-layer"></div>
    </div>
    <div id="grid-spacer"></div>
    <div id="cell-editor-wrap" hidden>
      <div id="cell-mirror" class="fx-mirror"></div>
      <textarea id="cell-editor" class="fx-edit" spellcheck="false" rows="1"></textarea>
    </div>
    <div id="autofill-ghost" hidden></div>
  </div>

  <!-- ==================== SHEET BAR ==================== -->
  <div id="sheetbar">
    <div id="sheetnav">
      <button id="sn-first" title="First sheet"><svg viewBox="0 0 12 10" width="12" height="10"><path d="M1 5l4-3v6zM6 5l4-3v6z" fill="currentColor"/></svg></button>
      <button id="sn-prev" title="Previous sheet"><svg viewBox="0 0 7 10" width="7" height="10"><path d="M6 1L2 5l4 4z" fill="currentColor"/></svg></button>
      <button id="sn-next" title="Next sheet"><svg viewBox="0 0 7 10" width="7" height="10"><path d="M1 1l4 4-4 4z" fill="currentColor"/></svg></button>
      <button id="sn-last" title="Last sheet"><svg viewBox="0 0 12 10" width="12" height="10"><path d="M11 5L7 2v6zM6 5L2 2v6z" fill="currentColor"/></svg></button>
    </div>
    <button id="sheet-new" title="New sheet"><svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 4.5v7M4.5 8h7" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <div id="sheet-tabs"></div>
  </div>

  <!-- ==================== STATUS BAR ==================== -->
  <div id="statusbar">
    <span id="sb-mode">Ready</span>
    <span id="sb-msg"></span>
    <span class="sb-flex"></span>
    <span id="sb-quick"></span>
    <span id="sb-caps"></span>
    <div id="sb-views">
      <button class="sb-view" data-view="normal" title="Normal"></button>
      <button class="sb-view" data-view="pagelayout" title="Page Layout"></button>
      <button class="sb-view" data-view="pagebreak" title="Page Break Preview"></button>
    </div>
    <div id="sb-zoom">
      <button id="zoom-out" title="Zoom Out">−</button>
      <div id="zoom-slider" class="cslider" role="slider" aria-label="Zoom" tabindex="0" title="Zoom level">
        <div class="cslider-track"><div class="cslider-fill"></div></div>
        <div class="cslider-thumb"></div>
      </div>
      <button id="zoom-in" title="Zoom In">+</button>
      <button id="zoom-pct" title="Zoom to...">100%</button>
    </div>
  </div>

</div>
<div id="overlay-root"></div>
<script src="idb.js"></script>
<script src="icons.js"></script>
<script src="calc.js"></script>
<script src="xlsx.js"></script>
<script src="legacy.js"></script>
<script src="rib.js"></script>
<script src="app.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
<script src="app4.js"></script>
<script src="boot.js"></script>
</body>
</html>
